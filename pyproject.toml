[project]
name = "olist-taller-ml"
version = "0.1.0"
description = "Taller de Aprendizaje Automático 2026-2 (Olist): Módulo 0, Módulo B (series de tiempo) y Módulo D (interpretabilidad e integración)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Datos y SQL
    "duckdb>=1.5.6",  # misma versión mínima que el repo del curso
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "kagglehub>=0.3",
    # Visualización
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Series de tiempo
    "statsmodels>=0.14",
    "holidays>=0.50",
    # Machine learning
    "scikit-learn>=1.5",
    "lightgbm>=4.3,<4.7",  # 4.7.0 falla en Windows con "access violation" al entrenar
    "optuna>=3.6",
    # Interpretabilidad (Módulo D)
    "shap>=0.45",
    # Notebooks
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "nbstripout>=0.7",
    "pytest>=8.2",
    "reportlab>=4.2",  # genera reports/informe/Informe_Taller_Olist.pdf
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
